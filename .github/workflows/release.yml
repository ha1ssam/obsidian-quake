name: Release

# Publish a release (or push a tag) named exactly like the version in manifest.json,
# e.g. 1.0.0 (no "v"). This workflow builds the plugin and attaches the files
# Obsidian needs: main.js, manifest.json and styles.css.
on:
  push:
    tags:
      - "*"
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build
      - name: Check tag matches manifest version
        run: |
          version=$(node -p 'require("./manifest.json").version')
          if [ "$version" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match manifest.json version $version" >&2
            exit 1
          fi
      - name: Create release or attach files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" > /dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" main.js manifest.json styles.css --clobber
          else
            gh release create "${GITHUB_REF_NAME}" main.js manifest.json styles.css --title "${GITHUB_REF_NAME}" --generate-notes
          fi
