name: Release

# Publish a release (or push a tag) named exactly like the version in manifest.json,
# e.g. 1.0.0 (no "v"). This workflow builds the plugin and attaches the files
# Obsidian needs: main.js, manifest.json and styles.css.
on:
  push:
    tags:
      - "*"
  release:
    types: [published]
  # Manual run: releases the version in manifest.json from the default branch.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build
      - name: Pick release tag
        run: |
          version=$(node -p 'require("./manifest.json").version')
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            echo "TAG=$version" >> "$GITHUB_ENV"
            echo "TARGET=${{ github.event.repository.default_branch }}" >> "$GITHUB_ENV"
          elif [ "$version" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match manifest.json version $version" >&2
            exit 1
          else
            echo "TAG=${GITHUB_REF_NAME}" >> "$GITHUB_ENV"
            echo "TARGET=${GITHUB_SHA}" >> "$GITHUB_ENV"
          fi
      - name: Create release or attach files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" main.js manifest.json styles.css --clobber
          else
            gh release create "$TAG" main.js manifest.json styles.css --title "$TAG" --target "$TARGET" --generate-notes
          fi
